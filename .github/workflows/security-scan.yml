name: security-scan
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly, Monday 05:17 UTC
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: {fetch-depth: 0}   # the whole history, not just the last commit
      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          V=8.30.1
          curl -sSL -o g.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  g.tgz" | sha256sum -c -
          tar xzf g.tgz gitleaks
      - name: Scan history
        run: ./gitleaks detect --source . --redact --report-format sarif --report-path gitleaks.sarif --exit-code 1
      - name: Upload results to the Security tab
        if: always() && github.event.repository.private == false
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with: {sarif_file: gitleaks.sarif, category: gitleaks}
  codeql:
    runs-on: ubuntu-latest
    permissions: {contents: read, security-events: write, actions: read}
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with: {languages: "${{ matrix.language }}", queries: security-extended}
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4
        with: {category: "codeql-${{ matrix.language }}", upload: "${{ github.event.repository.private == false }}"}
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with: {python-version: "3.12"}
      - name: Known vulnerabilities in requirements.lock (sends package names and versions to the PyPI advisory service)
        run: pip install pip-audit && pip-audit -r requirements.lock --progress-spinner off
