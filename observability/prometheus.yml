# Scrapes the assistant's /metrics (counts, routes and timings only; never text) and this Mac's own health (node_exporter).
# Edit the first target if you changed --bind or --port (setup.sh does it for you with TARGET=<ip>:<port>).
global:
  scrape_interval: 15s
rule_files:
  - prometheus.rules.yml
scrape_configs:
  - job_name: privhybrid
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8765"]
  - job_name: this-mac
    static_configs:
      - targets: ["127.0.0.1:9100"]
